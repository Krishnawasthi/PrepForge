server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: prepforge-backend
  cache:
    type: simple

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: gemini-3.5-flash-lite
    timeout-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.prepforge: DEBUG
    org.springframework.data.mongodb: INFO
